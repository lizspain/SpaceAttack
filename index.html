<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Attack</title>
  <style>
    :root {
      color-scheme: dark;
      background: #000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #game-ui {
      position: fixed;
      inset: 0;
      color: #fff;
      font-family: Arial, sans-serif;
      pointer-events: none;
    }

    #game-hud {
      display: flex;
      justify-content: space-between;
      padding: 20px 24px;
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 1px 4px #000;
    }

    .game-screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgb(0 0 0 / 78%);
      text-align: center;
      pointer-events: auto;
    }

    .game-screen[hidden],
    #game-hud[hidden] {
      display: none;
    }

    .screen-content {
      max-width: 520px;
    }

    .game-screen h1 {
      margin: 0 0 16px;
      color: #ffff00;
      font-size: clamp(32px, 7vw, 56px);
      letter-spacing: 0.08em;
    }

    .game-screen p {
      margin: 8px 0;
      line-height: 1.5;
    }

    .game-screen button {
      margin-top: 20px;
      padding: 12px 24px;
      border: 0;
      border-radius: 4px;
      background: #39ff14;
      color: #000;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .game-screen button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <canvas id="starfield" aria-label="A black sky with twinkling yellow stars and a player ship"></canvas>
  <div id="game-ui">
    <div id="game-hud" aria-live="polite" hidden>
      <span>Lives: <span id="lives-value">3</span></span>
      <span>Score: <span id="score-value">0</span></span>
      <span>Wave: <span id="wave-value">1</span></span>
    </div>
    <section id="start-screen" class="game-screen" aria-labelledby="start-title">
      <div class="screen-content">
        <h1 id="start-title">SPACE ATTACK</h1>
        <p>Move: A / D or the left and right arrow keys</p>
        <p>Fire: tap or hold the spacebar</p>
        <button id="start-button" type="button">Start Game</button>
      </div>
    </section>
    <section id="game-over-screen" class="game-screen" aria-labelledby="game-over-title" hidden>
      <div class="screen-content">
        <h1 id="game-over-title">GAME OVER</h1>
        <p>Final score: <span id="final-score">0</span></p>
        <button id="restart-button" type="button">Play Again</button>
      </div>
    </section>
  </div>

  <script>
    const STAR_COUNT = 128;
    const STAR_SIZE = 1;
    const MIN_TWINKLE_SPEED = 0.7;
    const MAX_TWINKLE_SPEED = 1.8;
    const SHIP_WIDTH = 28;
    const SHIP_HEIGHT = 24;
    const SHIP_BOTTOM_MARGIN = 20;
    const SHIP_TAP_DISTANCE = 16;
    const SHIP_SPEED = 280;
    const PROJECTILE_WIDTH = 2;
    const PROJECTILE_HEIGHT = 16;
    const PROJECTILE_VELOCITY = -2;
    const PROJECTILE_FIRE_INTERVAL = 400;
    const ENEMY_SIZE = 32;
    const ENEMY_PROJECTILE_WIDTH = 2;
    const ENEMY_PROJECTILE_HEIGHT = 16;
    const ENEMY_PROJECTILE_VELOCITY = 2;
    const ENEMY_FIRE_INTERVAL = 3000;
    const ENEMY_ADVANCING_FIRE_INTERVAL = 1000;
    const ENEMY_ADVANCING_CHANCE = 0.1;
    const ENEMY_ADVANCING_SPEED = 1.4;
    const ENEMY_ADVANCING_HORIZONTAL_SPEED = 1.4;
    const ENEMY_ADVANCING_HORIZONTAL_MARGIN = 248;
    const ENEMIES_PER_WAVE_MULTIPLIER = 1.3;
    const ENEMY_COLOR = "#ff3030";
    const ENEMY_EDGE_MARGIN = 64;
    const ENEMY_DESCENT_DISTANCE = 64;
    const ENEMY_FORMATION_START_SPEED = 0.4;
    const ENEMY_FORMATION_SPEED_MULTIPLIER = 1.3;
    const INITIAL_ENEMY_ROWS = 2;
    const INITIAL_ENEMY_COLUMNS = 4;
    const MAX_ENEMY_ROWS = 6;
    const MAX_ENEMY_COLUMNS = 16;
    const MAX_ENEMIES = MAX_ENEMY_ROWS * MAX_ENEMY_COLUMNS;
    const INITIAL_ENEMY_COUNT = INITIAL_ENEMY_ROWS * INITIAL_ENEMY_COLUMNS;
    const ENEMY_GRID_GAP = 16;
    const HUD_TOP_PADDING = 20;
    const HUD_ROW_HEIGHT = 20;
    const ENEMY_HUD_GAP = 20;
    const SHIP_FLASH_INTERVAL = 0.1;
    const START = "start";
    const PLAYING = "playing";
    const GAME_OVER = "game-over";
    const STARTING_LIVES = 3;
    const ENEMY_FORMATION = "formation";
    const ENEMY_ADVANCING = "advancing";
    const ENEMY_FIRE_CHANCE = {
      [ENEMY_FORMATION]: 0.15,
    };
    const ENEMY_SPRITE = [
      "...##...",
      "..####..",
      ".######.",
      "########",
      "##.##.##",
      "########",
      ".#.##.#.",
      "##....##",
    ];

    const canvas = document.querySelector("#starfield");
    const context = canvas.getContext("2d");
    const startScreen = document.querySelector("#start-screen");
    const gameOverScreen = document.querySelector("#game-over-screen");
    const gameHud = document.querySelector("#game-hud");
    const livesValue = document.querySelector("#lives-value");
    const scoreValue = document.querySelector("#score-value");
    const waveValue = document.querySelector("#wave-value");
    const finalScore = document.querySelector("#final-score");
    const startButton = document.querySelector("#start-button");
    const restartButton = document.querySelector("#restart-button");
    let stars = [];
    let width = 0;
    let height = 0;
    let enemies = [];
    let formationColumns = INITIAL_ENEMY_COLUMNS;
    let formationX = 0;
    let formationY = HUD_TOP_PADDING + HUD_ROW_HEIGHT + ENEMY_HUD_GAP;
    let formationDirection = 1;
    let formationSpeed = ENEMY_FORMATION_START_SPEED;
    let formationStartSpeed = ENEMY_FORMATION_START_SPEED;
    let shipX = 0;
    let shipHasSpawned = false;
    let previousFrameTime = 0;
    let lastProjectileTime = -Infinity;
    let projectileRequested = false;
    let shipFlashElapsed = 0;
    let shipFlashChangesRemaining = 0;
    let shipIsFlashingBlack = false;
    let shipIsFlashing = false;
    let gameState = START;
    let gameData = { lives: STARTING_LIVES, score: 0, wave: 1 };
    let previousShipCollisions = new Set();
    const heldKeys = new Set();
    const projectiles = [];
    const enemyProjectiles = [];
    // Future collidables can join this set with getBounds() returning left, top, width, and height.
    const collidableObjects = new Set();
    const shipCollider = {
      getBounds() {
        return {
          left: shipX,
          top: height - SHIP_BOTTOM_MARGIN - SHIP_HEIGHT,
          width: SHIP_WIDTH,
          height: SHIP_HEIGHT,
        };
      },
      collisions: [],
    };

    const LEFT_KEYS = new Set(["a", "arrowleft"]);
    const RIGHT_KEYS = new Set(["d", "arrowright"]);

    function createStar() {
      return {
        x: Math.random() * width,
        y: Math.random() * height,
        phase: Math.random() * Math.PI * 2,
        speed: MIN_TWINKLE_SPEED + Math.random() * (MAX_TWINKLE_SPEED - MIN_TWINKLE_SPEED),
      };
    }

    function createEnemy(x, y, gridRow, gridColumn, gridRowCount) {
      return {
        x,
        y,
        gridRow,
        gridColumn,
        gridRowCount,
        width: ENEMY_SIZE,
        height: ENEMY_SIZE,
        color: ENEMY_COLOR,
        state: ENEMY_FORMATION,
        velocityX: 0,
        fireCycleStartedAt: null,
        type: "enemy",
        getBounds() {
          return { left: this.x, top: this.y, width: this.width, height: this.height };
        },
      };
    }

    function getEnemyGridWidth() {
      return formationColumns * ENEMY_SIZE
        + (formationColumns - 1) * ENEMY_GRID_GAP;
    }

    function getFormationLimits() {
      const gridWidth = getEnemyGridWidth();
      const minX = Math.min(ENEMY_EDGE_MARGIN, Math.max(0, (width - gridWidth) / 2));
      const maxX = Math.max(minX, width - ENEMY_EDGE_MARGIN - gridWidth);
      return { minX, maxX };
    }

    function positionEnemies() {
      for (const enemy of enemies) {
        if (enemy.state !== ENEMY_FORMATION) continue;
        const rowWidth = enemy.gridRowCount * ENEMY_SIZE
          + (enemy.gridRowCount - 1) * ENEMY_GRID_GAP;
        const rowLeft = formationX + (getEnemyGridWidth() - rowWidth) / 2;
        enemy.x = rowLeft + enemy.gridColumn * (ENEMY_SIZE + ENEMY_GRID_GAP);
        enemy.y = formationY + enemy.gridRow * (ENEMY_SIZE + ENEMY_GRID_GAP);
      }
    }

    function getEnemyGridLayout(enemyCount) {
      const columns = Math.min(MAX_ENEMY_COLUMNS, Math.max(
        INITIAL_ENEMY_COLUMNS,
        Math.ceil(Math.sqrt(enemyCount * 2)),
        Math.ceil(enemyCount / MAX_ENEMY_ROWS),
      ));
      return { columns, rows: Math.ceil(enemyCount / columns) };
    }

    function createEnemyGrid(enemyCount = gameData.enemiesPerWave) {
      const layout = getEnemyGridLayout(enemyCount);
      formationColumns = layout.columns;
      enemies = Array.from({ length: enemyCount }, (_, index) => {
        const gridRow = Math.floor(index / layout.columns);
        const gridColumn = index % layout.columns;
        const gridRowCount = Math.min(layout.columns, enemyCount - gridRow * layout.columns);
        return createEnemy(0, 0, gridRow, gridColumn, gridRowCount);
      });

      const { minX, maxX } = getFormationLimits();
      formationX = Math.max(minX, Math.min(maxX, (width - getEnemyGridWidth()) / 2));
      formationY = HUD_TOP_PADDING + HUD_ROW_HEIGHT + ENEMY_HUD_GAP;
      formationDirection = 1;
      formationSpeed = formationStartSpeed;
      positionEnemies();
      for (const enemy of enemies) collidableObjects.add(enemy);
    }

    function resizeCanvas() {
      const pixelRatio = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      stars = Array.from({ length: STAR_COUNT }, createStar);
      const { minX, maxX } = getFormationLimits();
      formationX = Math.max(minX, Math.min(maxX, formationX));
      positionEnemies();
      if (!shipHasSpawned) {
        shipX = Math.max(0, (width - SHIP_WIDTH) / 2);
        shipHasSpawned = true;
      } else {
        shipX = Math.min(shipX, Math.max(0, width - SHIP_WIDTH));
      }
    }

    function moveShipBy(distance) {
      shipX = Math.max(0, Math.min(width - SHIP_WIDTH, shipX + distance));
    }

    function handleKeyDown(event) {
      if (gameState !== PLAYING) return;

      const key = event.key.toLowerCase();
      // DEBUG ONLY: remove the P shortcut before publishing.
      if (key === "p") {
        heldKeys.clear();
        gameData.lives = 0;
        setGameState(GAME_OVER);
        return;
      }

      if (key === " ") {
        event.preventDefault();
        if (!heldKeys.has(key)) projectileRequested = true;
        heldKeys.add(key);
        return;
      }

      const isLeft = LEFT_KEYS.has(key);
      const isRight = RIGHT_KEYS.has(key);

      if (!isLeft && !isRight) return;
      event.preventDefault();
      heldKeys.add(key);

      if (!event.repeat) {
        moveShipBy(isLeft ? -SHIP_TAP_DISTANCE : SHIP_TAP_DISTANCE);
      }
    }

    function handleKeyUp(event) {
      heldKeys.delete(event.key.toLowerCase());
    }

    function updateHud() {
      livesValue.textContent = gameData.lives;
      scoreValue.textContent = gameData.score;
      waveValue.textContent = gameData.wave;
      finalScore.textContent = gameData.score;
    }

    function setGameState(nextState) {
      gameState = nextState;
      startScreen.hidden = gameState !== START;
      gameHud.hidden = gameState !== PLAYING;
      gameOverScreen.hidden = gameState !== GAME_OVER;
      updateHud();
    }

    function resetGameData() {
      gameData = {
        lives: STARTING_LIVES,
        score: 0,
        wave: 1,
        enemiesPerWave: INITIAL_ENEMY_COUNT,
      };
      projectiles.length = 0;
      collidableObjects.clear();
      previousShipCollisions.clear();
      shipCollider.collisions = [];
      shipFlashElapsed = 0;
      shipFlashChangesRemaining = 0;
      shipIsFlashingBlack = false;
      shipIsFlashing = false;
      shipX = Math.max(0, (width - SHIP_WIDTH) / 2);
      lastProjectileTime = -Infinity;
      projectileRequested = false;
      enemyProjectiles.length = 0;
      formationStartSpeed = ENEMY_FORMATION_START_SPEED;
      createEnemyGrid();
      heldKeys.clear();
      previousFrameTime = 0;
    }

    function initializeGame() {
      resetGameData();
      setGameState(START);
    }

    function startNewGame() {
      resetGameData();
      setGameState(PLAYING);
    }

    function getElapsedSeconds(time) {
      if (previousFrameTime === 0) previousFrameTime = time;
      const elapsedSeconds = Math.min((time - previousFrameTime) / 1000, 0.05);
      previousFrameTime = time;
      return elapsedSeconds;
    }

    function updateShip(elapsedSeconds) {
      const movingLeft = [...heldKeys].some((key) => LEFT_KEYS.has(key));
      const movingRight = [...heldKeys].some((key) => RIGHT_KEYS.has(key));
      const direction = Number(movingRight) - Number(movingLeft);
      moveShipBy(direction * SHIP_SPEED * elapsedSeconds);
    }

    function updateFormation(elapsedSeconds) {
      if (enemies.some((enemy) => enemy.state === ENEMY_FORMATION)) {
        const { minX, maxX } = getFormationLimits();
        if (maxX > minX) {
          // Formation speed is measured in canvas pixels per 60 Hz frame.
          formationX += formationDirection * formationSpeed * elapsedSeconds * 60;

          if (formationDirection > 0 && formationX >= maxX) {
            formationX = maxX;
            formationDirection = -1;
            formationY += ENEMY_DESCENT_DISTANCE;
            formationSpeed *= ENEMY_FORMATION_SPEED_MULTIPLIER;
          } else if (formationDirection < 0 && formationX <= minX) {
            formationX = minX;
            formationDirection = 1;
            formationY += ENEMY_DESCENT_DISTANCE;
            formationSpeed *= ENEMY_FORMATION_SPEED_MULTIPLIER;
          }
        }
      }

      positionEnemies();

      removeBreachedEnemies();
    }

    function removeBreachedEnemies() {
      for (const enemy of [...enemies]) {
        if (enemy.y + enemy.height >= height) {
          removeEnemy(enemy);
          loseShipLife();
          if (gameState !== PLAYING) break;
        }
      }
    }

    function startNextWave() {
      const requestedCount = Math.ceil(gameData.enemiesPerWave * ENEMIES_PER_WAVE_MULTIPLIER);
      gameData.wave += 1;
      if (gameData.enemiesPerWave >= MAX_ENEMIES) {
        formationStartSpeed *= 1.5;
      } else {
        formationStartSpeed *= 1.2;
      }
      if (requestedCount > MAX_ENEMIES) {
        gameData.enemiesPerWave = MAX_ENEMIES;
      } else {
        gameData.enemiesPerWave = requestedCount;
      }
      createEnemyGrid();
      updateHud();
    }

    function createEnemyProjectile(enemy) {
      return {
        x: enemy.x + (enemy.width - ENEMY_PROJECTILE_WIDTH) / 2,
        y: enemy.y + enemy.height,
        width: ENEMY_PROJECTILE_WIDTH,
        height: ENEMY_PROJECTILE_HEIGHT,
        velocityX: 0,
        velocityY: ENEMY_PROJECTILE_VELOCITY,
        getBounds() {
          return { left: this.x, top: this.y, width: this.width, height: this.height };
        },
      };
    }

    function updateAdvancingEnemy(enemy, elapsedSeconds) {
      const hasRoomForSideMargins = width >= ENEMY_ADVANCING_HORIZONTAL_MARGIN * 2 + enemy.width;
      const margin = hasRoomForSideMargins ? ENEMY_ADVANCING_HORIZONTAL_MARGIN : 0;
      const leftLimit = margin;
      const rightLimit = Math.max(leftLimit, width - enemy.width - margin);
      enemy.x += enemy.velocityX * elapsedSeconds * 60;
      enemy.y += ENEMY_ADVANCING_SPEED * elapsedSeconds * 60;

      if (enemy.x <= 0 || enemy.x + enemy.width >= width) {
        enemy.x = Math.max(0, Math.min(width - enemy.width, enemy.x));
        enemy.velocityX = enemy.x <= 0 ? ENEMY_ADVANCING_HORIZONTAL_SPEED : -ENEMY_ADVANCING_HORIZONTAL_SPEED;
      } else if (enemy.x <= leftLimit && enemy.velocityX < 0) {
        enemy.x = leftLimit;
        enemy.velocityX = ENEMY_ADVANCING_HORIZONTAL_SPEED;
      } else if (enemy.x >= rightLimit && enemy.velocityX > 0) {
        enemy.x = rightLimit;
        enemy.velocityX = -ENEMY_ADVANCING_HORIZONTAL_SPEED;
      }
    }

    function updateEnemy(enemy, time, elapsedSeconds) {
      if (enemy.state === ENEMY_ADVANCING) updateAdvancingEnemy(enemy, elapsedSeconds);
      if (enemy.fireCycleStartedAt === null) {
        enemy.fireCycleStartedAt = time;
        return;
      }

      while (true) {
        const fireInterval = enemy.state === ENEMY_ADVANCING
          ? ENEMY_ADVANCING_FIRE_INTERVAL
          : ENEMY_FIRE_INTERVAL;
        if (time - enemy.fireCycleStartedAt < fireInterval) break;
        enemy.fireCycleStartedAt += fireInterval;

        if (enemy.state === ENEMY_ADVANCING) {
          enemyProjectiles.push(createEnemyProjectile(enemy));
          continue;
        }

        if (Math.random() < ENEMY_FIRE_CHANCE[ENEMY_FORMATION]) {
          enemyProjectiles.push(createEnemyProjectile(enemy));
        }
        if (Math.random() < ENEMY_ADVANCING_CHANCE) {
          enemy.state = ENEMY_ADVANCING;
          enemy.velocityX = ENEMY_ADVANCING_HORIZONTAL_SPEED;
          break;
        }
      }
    }

    function startShipFlash() {
      shipIsFlashing = true;
      shipIsFlashingBlack = true;
      shipFlashElapsed = 0;
      shipFlashChangesRemaining = 5;
    }

    function updateShipFlash(elapsedSeconds) {
      if (!shipIsFlashing) return;

      shipFlashElapsed += elapsedSeconds;
      while (shipFlashElapsed >= SHIP_FLASH_INTERVAL && shipFlashChangesRemaining > 0) {
        shipFlashElapsed -= SHIP_FLASH_INTERVAL;
        shipFlashChangesRemaining -= 1;
        shipIsFlashingBlack = !shipIsFlashingBlack;
      }

      if (shipFlashChangesRemaining === 0) {
        shipIsFlashing = false;
        shipIsFlashingBlack = false;
      }
    }

    function loseShipLife() {
      if (gameState !== PLAYING) return;
      gameData.lives = Math.max(0, gameData.lives - 1);
      startShipFlash();
      updateHud();
      if (gameData.lives === 0) setGameState(GAME_OVER);
    }

    function updateEnemies(time, elapsedSeconds) {
      for (const enemy of [...enemies]) updateEnemy(enemy, time, elapsedSeconds);
      removeBreachedEnemies();
    }

    function updateEnemyProjectiles(elapsedSeconds) {
      const activeProjectiles = [];
      const shipBounds = shipCollider.getBounds();

      for (const projectile of enemyProjectiles) {
        projectile.y += projectile.velocityY * elapsedSeconds * 60;
        const hitsShip = rectanglesOverlap(projectile.getBounds(), shipBounds);

        if (hitsShip) {
          loseShipLife();
        } else if (projectile.y <= height) {
          activeProjectiles.push(projectile);
        }
      }

      enemyProjectiles.length = 0;
      enemyProjectiles.push(...activeProjectiles);
    }

    function createProjectile() {
      const shipBounds = shipCollider.getBounds();
      return {
        x: shipBounds.left + (SHIP_WIDTH - PROJECTILE_WIDTH) / 2,
        y: shipBounds.top - PROJECTILE_HEIGHT,
        width: PROJECTILE_WIDTH,
        height: PROJECTILE_HEIGHT,
        velocityX: 0,
        velocityY: PROJECTILE_VELOCITY,
        collisions: [],
        getBounds() {
          return { left: this.x, top: this.y, width: this.width, height: this.height };
        },
      };
    }

    function updateWeapon(time) {
      const spacebarHeld = heldKeys.has(" ");
      const shouldFire = projectileRequested
        || (spacebarHeld && time - lastProjectileTime >= PROJECTILE_FIRE_INTERVAL);

      if (!shouldFire) return;

      projectiles.push(createProjectile());
      lastProjectileTime = time;
      projectileRequested = false;
    }

    function rectanglesOverlap(first, second) {
      return first.left < second.left + second.width
        && first.left + first.width > second.left
        && first.top < second.top + second.height
        && first.top + first.height > second.top;
    }

    function findCollisions(entity) {
      const bounds = entity.getBounds();
      return [...collidableObjects].filter((target) => (
        typeof target.getBounds === "function"
        && rectanglesOverlap(bounds, target.getBounds())
      ));
    }

    function updateShipCollisions() {
      const collisions = findCollisions(shipCollider);
      const newCollisions = collisions.filter((target) => !previousShipCollisions.has(target));

      for (const target of newCollisions) {
        loseShipLife();
        target.onShipCollision?.(shipCollider);
      }

      shipCollider.collisions = collisions;
      previousShipCollisions = new Set(collisions);

      if (newCollisions.length > 0) updateHud();
      if (gameData.lives === 0) setGameState(GAME_OVER);
    }

    function removeEnemy(enemy, awardPoints = false) {
      const enemyIndex = enemies.indexOf(enemy);
      if (enemyIndex === -1) return false;

      enemies.splice(enemyIndex, 1);
      collidableObjects.delete(enemy);
      previousShipCollisions.delete(enemy);
      if (awardPoints) gameData.score += 100;
      return true;
    }

    function updateProjectiles(elapsedSeconds) {
      const activeProjectiles = [];
      let scoreChanged = false;

      for (const projectile of projectiles) {
        // Velocity is in canvas pixels per 60 Hz frame; scale it for the frame duration.
        projectile.x += projectile.velocityX * elapsedSeconds * 60;
        projectile.y += projectile.velocityY * elapsedSeconds * 60;
        projectile.collisions = findCollisions(projectile);

        for (const target of projectile.collisions) {
          if (target.type === "enemy") {
            scoreChanged = removeEnemy(target, true) || scoreChanged;
          } else {
            gameData.score += Number(target.scoreValue) || 0;
            scoreChanged = true;
            target.onCollision?.(projectile);
          }
        }

        const aboveCanvas = projectile.y + projectile.height < 0;
        if (projectile.collisions.length === 0 && !aboveCanvas) {
          activeProjectiles.push(projectile);
        }
      }

      projectiles.length = 0;
      projectiles.push(...activeProjectiles);
      updateShipCollisions();
      if (scoreChanged) updateHud();
      if (gameState === PLAYING && enemies.length === 0) startNextWave();
    }

    function drawShip() {
      const shipBounds = shipCollider.getBounds();

      context.globalAlpha = 1;
      context.fillStyle = shipIsFlashingBlack ? "#000000" : "#39ff14";
      context.beginPath();
      context.moveTo(shipBounds.left + SHIP_WIDTH / 2, shipBounds.top);
      context.lineTo(shipBounds.left + SHIP_WIDTH, shipBounds.top + SHIP_HEIGHT);
      context.lineTo(shipBounds.left, shipBounds.top + SHIP_HEIGHT);
      context.closePath();
      context.fill();
    }

    function drawProjectiles() {
      context.globalAlpha = 1;
      context.fillStyle = "#39ff14";

      for (const projectile of projectiles) {
        context.fillRect(projectile.x, projectile.y, projectile.width, projectile.height);
      }
    }

    function drawEnemy(enemy) {
      context.globalAlpha = 1;
      context.fillStyle = enemy.color;

      for (let row = 0; row < ENEMY_SPRITE.length; row += 1) {
        for (let column = 0; column < ENEMY_SPRITE[row].length; column += 1) {
          if (ENEMY_SPRITE[row][column] === "#") {
            context.fillRect(enemy.x + column * 4, enemy.y + row * 4, 4, 4);
          }
        }
      }
    }

    function drawEnemyProjectiles() {
      context.globalAlpha = 1;
      context.fillStyle = ENEMY_COLOR;

      for (const projectile of enemyProjectiles) {
        context.fillRect(projectile.x, projectile.y, projectile.width, projectile.height);
      }
    }

    function draw(time) {
      const elapsedSeconds = getElapsedSeconds(time);
      if (gameState === PLAYING) {
        updateShip(elapsedSeconds);
        updateWeapon(time);
        updateFormation(elapsedSeconds);
        updateProjectiles(elapsedSeconds);
        updateEnemies(time, elapsedSeconds);
        updateEnemyProjectiles(elapsedSeconds);
      }
      updateShipFlash(elapsedSeconds);
      context.clearRect(0, 0, width, height);

      for (const star of stars) {
        const twinkle = (Math.sin(time * 0.001 * star.speed + star.phase) + 1) / 2;
        context.globalAlpha = 0.25 + twinkle * 0.75;
        context.fillStyle = "#ffff00";
        context.fillRect(star.x, star.y, STAR_SIZE, STAR_SIZE);
      }

      context.globalAlpha = 1;
      for (const enemy of enemies) drawEnemy(enemy);
      drawProjectiles();
      drawEnemyProjectiles();
      drawShip();
      window.requestAnimationFrame(draw);
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("keydown", handleKeyDown);
    window.addEventListener("keyup", handleKeyUp);
    window.addEventListener("blur", () => heldKeys.clear());
    startButton.addEventListener("click", startNewGame);
    restartButton.addEventListener("click", startNewGame);
    resizeCanvas();
    initializeGame();
    window.requestAnimationFrame(draw);
  </script>
</body>
</html>
